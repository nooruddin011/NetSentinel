# docker compose up --build        ->  http://localhost:8080
# Needs a .env file (copy .env.example). APP_ENV=production is enforced inside the backend image:
# set JWT_SECRET and ADMIN_PASSWORD, and CORS_ORIGINS=http://localhost:8080
services:
  backend:
    build: { context: ., dockerfile: docker/backend.Dockerfile }
    env_file: .env
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    volumes:
      - cyberwatch-data:/app/data          # SQLite database + logs persist here
      - ./models:/app/models               # trained models (retrain from the UI writes here)
    restart: unless-stopped
  frontend:
    build: { context: ., dockerfile: docker/frontend.Dockerfile }
    ports: ["8080:80"]
    depends_on: [backend]
    restart: unless-stopped
volumes:
  cyberwatch-data:

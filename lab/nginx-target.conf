# Logging reverse proxy in front of the vulnerable target.
# It writes a standard "combined" access log into a shared volume, which the Argus collector follows.
events {}
http {
  log_format combined_lab '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/argus_access.log combined_lab;
  server {
    listen 80;
    location = /healthz { access_log off; return 200 "ok"; }
    location / {
      proxy_pass http://dvwa:80;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
